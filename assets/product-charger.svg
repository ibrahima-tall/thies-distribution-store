<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Chargeur mural USB-C blanc</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <linearGradient id="charger" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#background)"/>
  <ellipse cx="410" cy="450" rx="150" ry="38" fill="#152744" opacity=".16" filter="url(#shadow)"/>
  <g transform="rotate(-10 400 300)">
    <rect x="280" y="130" width="240" height="310" rx="44" fill="url(#charger)" stroke="#d4dbe5" stroke-width="5"/>
    <rect x="348" y="166" width="104" height="20" rx="10" fill="#eef1f5"/>
    <rect x="362" y="418" width="22" height="77" rx="10" fill="#aeb8c6"/>
    <rect x="414" y="418" width="22" height="77" rx="10" fill="#aeb8c6"/>
    <rect x="350" y="270" width="100" height="54" rx="17" fill="#dbe3ee"/>
    <rect x="371" y="286" width="58" height="22" rx="11" fill="#596b84"/>
    <circle cx="400" cy="355" r="8" fill="#0756d9"/>
  </g>
</svg>
